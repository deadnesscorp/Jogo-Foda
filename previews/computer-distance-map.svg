<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
  <title id="title">Distribuição prevista dos oito computadores</title>
  <desc id="desc">Mapa esquemático de um mundo de 12.800 por 11.200 unidades. Os pontos-base dos computadores ficam separados por pelo menos 5.100 unidades; o gerador mantém no mínimo 4.500 unidades.</desc>
  <rect width="900" height="850" fill="#10191b"/>
  <text x="48" y="42" fill="#e1e8db" font-family="monospace" font-size="18" font-weight="bold">DISTRIBUIÇÃO DOS COMPUTADORES</text>
  <text x="48" y="65" fill="#91a49c" font-family="monospace" font-size="11">Mapa esquemático · 12.800 × 11.200 unidades · 8 computadores</text>

  <rect x="72" y="84" width="768" height="672" rx="4" fill="#182523" stroke="#52665e" stroke-width="2"/>
  <g stroke="#2b3b37" stroke-width="1">
    <path d="M264 84V756M456 84V756M648 84V756"/>
    <path d="M72 252H840M72 420H840M72 588H840"/>
  </g>
  <g fill="#74877f" font-family="monospace" font-size="10">
    <text x="72" y="777">OESTE</text><text x="840" y="777" text-anchor="end">LESTE</text>
    <text x="54" y="90" text-anchor="end">N</text><text x="54" y="756" text-anchor="end">S</text>
  </g>

  <g stroke="#83cbb0" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <path d="M144 114H468M468 114H792M144 420H468M468 420H792M144 726H468"/>
    <path d="M144 114V420M144 420V726M468 114V420M468 420V726M792 114V420"/>
  </g>
  <g fill="#bad7c6" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="306" y="101">5.400 u.</text><text x="630" y="101">5.400 u.</text>
    <text x="306" y="407">5.400 u.</text><text x="630" y="407">5.400 u.</text>
    <text x="306" y="713">5.400 u.</text>
  </g>
  <g fill="#bad7c6" font-family="monospace" font-size="10">
    <text x="157" y="273">5.100 u.</text><text x="157" y="579">5.100 u.</text>
    <text x="481" y="273">5.100 u.</text><text x="481" y="579">5.100 u.</text>
    <text x="805" y="273">5.100 u.</text>
  </g>

  <g font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
    <g><circle cx="144" cy="114" r="16" fill="#e0a86d" stroke="#ffe0a8" stroke-width="2"/><text x="144" y="118" fill="#17201e">01</text><text x="144" y="145" fill="#e7dfc9" font-size="9">COMPUTADOR 01</text></g>
    <g><circle cx="468" cy="114" r="16" fill="#e0a86d" stroke="#ffe0a8" stroke-width="2"/><text x="468" y="118" fill="#17201e">02</text><text x="468" y="145" fill="#e7dfc9" font-size="9">COMPUTADOR 02</text></g>
    <g><circle cx="792" cy="114" r="16" fill="#e0a86d" stroke="#ffe0a8" stroke-width="2"/><text x="792" y="118" fill="#17201e">03</text><text x="792" y="145" fill="#e7dfc9" font-size="9">COMPUTADOR 03</text></g>
    <g><circle cx="144" cy="420" r="16" fill="#83cbb0" stroke="#c6efda" stroke-width="2"/><text x="144" y="424" fill="#17201e">04</text><text x="144" y="451" fill="#e7dfc9" font-size="9">COMPUTADOR 04</text></g>
    <g><circle cx="468" cy="420" r="16" fill="#83cbb0" stroke="#c6efda" stroke-width="2"/><text x="468" y="424" fill="#17201e">05</text><text x="468" y="451" fill="#e7dfc9" font-size="9">COMPUTADOR 05</text></g>
    <g><circle cx="792" cy="420" r="16" fill="#83cbb0" stroke="#c6efda" stroke-width="2"/><text x="792" y="424" fill="#17201e">06</text><text x="792" y="451" fill="#e7dfc9" font-size="9">COMPUTADOR 06</text></g>
    <g><circle cx="144" cy="726" r="16" fill="#96a8e0" stroke="#d1dcff" stroke-width="2"/><text x="144" y="730" fill="#17201e">07</text><text x="144" y="698" fill="#e7dfc9" font-size="9">COMPUTADOR 07</text></g>
    <g><circle cx="468" cy="726" r="16" fill="#96a8e0" stroke="#d1dcff" stroke-width="2"/><text x="468" y="730" fill="#17201e">08</text><text x="468" y="698" fill="#e7dfc9" font-size="9">COMPUTADOR 08</text></g>
