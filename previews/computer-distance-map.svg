  <rect x="48" y="793" width="804" height="37" rx="3" fill="#1a2825" stroke="#3a5148"/>
  <text x="64" y="817" fill="#c6d5c9" font-family="monospace" font-size="11">Pontos-base: menor distância 5.100 u. · geração mantém no mínimo 4.500 u. e pode deslocar pontos se houver obstáculos.</text>
