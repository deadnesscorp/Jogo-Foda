<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobrevivente e moto · 128 direções</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#0e0d15;color:#eee5f7;font:14px system-ui}main{max-width:1100px;margin:auto}h1{font-size:24px}p{color:#b6a5c6}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:24px 0;padding:16px;border:1px solid #5f4673;border-radius:10px;background:#201828}input[type=range]{width:240px;accent-color:#bf8fe0}button{padding:9px 18px;border:1px solid #8d65a6;background:#392248;color:#f1e1fd;border-radius:6px;cursor:pointer}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}figure{margin:0;border:1px solid #60416e;border-radius:12px;overflow:hidden;background:repeating-conic-gradient(#25202e 0% 25%,#1b1723 0% 50%) 0/20px 20px}canvas{display:block;width:100%;height:auto}figcaption{padding:13px;background:#191320;color:#e7c9fa;font-weight:600}small{display:block;font-weight:400;color:#aa95b9;margin-top:4px}@media(max-width:700px){.stage{grid-template-columns:1fr}body{padding:16px}}
</style>
<main><h1>Sobrevivente · 128 direções</h1><p>Moto, piloto montado e personagem a pé. 384 quadros transparentes, sem requisições durante a animação.</p>
<div class="controls"><button id="pause">Pausar</button><label>Direção <input id="direction" type="range" min="0" max="127" value="0"></label><label>Velocidade <input id="speed" type="range" min="1" max="48" value="16"></label><strong id="heading">Carregando…</strong></div>
<section class="stage"><figure><canvas id="bike" width="384" height="300"></canvas><figcaption>Moto<small>128 poses · estacionada</small></figcaption></figure><figure><canvas id="mounted" width="384" height="300"></canvas><figcaption>Piloto montado<small>128 poses · mãos no guidão e pés nas pedaleiras</small></figcaption></figure><figure><canvas id="survivor" width="384" height="300"></canvas><figcaption>Sobrevivente<small>128 poses · capacete, máscara, mochila e corda</small></figcaption></figure></section></main>
<script src="atlas.js"></script>
<script>
const atlas=SURVIVOR_ATLAS_128,slider=document.querySelector('#direction'),heading=document.querySelector('#heading');
const kinds=['bike','mounted','survivor'],images={};let paused=false,phase=0,last=0;
const ready=Promise.all(kinds.map(kind=>new Promise((resolve,reject)=>{const img=new Image();images[kind]=img;img.onload=resolve;img.onerror=reject;img.src=atlas[kind].file;})));
let loaded=false;ready.then(()=>loaded=true).catch(()=>heading.textContent='Não foi possível carregar uma folha.');
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Continuar':'Pausar';};
slider.oninput=()=>{phase=Number(slider.value);paused=true;document.querySelector('#pause').textContent='Continuar';};
function paint(kind,direction){const data=atlas[kind],canvas=document.getElementById(kind),ctx=canvas.getContext('2d'),[sx,sy,sw,sh]=data.frames[direction],contacts=data.wheelContacts[direction],scale=(kind==='survivor'?120:180)/(data.width/16);const ax=contacts.reduce((s,p)=>s+p[0],0)/contacts.length,ay=contacts.reduce((s,p)=>s+p[1],0)/contacts.length;ctx.clearRect(0,0,384,300);ctx.strokeStyle='#a17db855';ctx.beginPath();ctx.moveTo(20,244);ctx.lineTo(364,244);ctx.moveTo(192,40);ctx.lineTo(192,265);ctx.stroke();ctx.imageSmoothingEnabled=false;ctx.drawImage(images[kind],sx,sy,sw,sh,192-ax*scale,244-ay*scale,sw*scale,sh*scale);ctx.fillStyle='#a5d69b';for(const [x,y]of contacts){ctx.beginPath();ctx.arc(192+(x-ax)*scale,244+(y-ay)*scale,2,0,Math.PI*2);ctx.fill();}}
function frame(now){const dt=last?Math.min(100,now-last):0;last=now;if(!paused)phase=(phase+dt/1000*Number(document.querySelector('#speed').value))%128;if(loaded){const direction=Math.floor(phase);slider.value=direction;heading.textContent=(direction+1)+' / 128 · '+(direction*2.8125).toFixed(2)+'°';for(const kind of kinds)paint(kind,direction);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
</html>
